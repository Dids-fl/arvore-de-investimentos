name: Validação tributária

on:
  push:
    paths:
      - "tributacao/**"
      - "validacao/tributacao/**"
      - "tests/fixtures/tributacao/**"
      - "tests/unit/test_tributacao*.py"
      - "tests/unit/test_validadores_tributarios_independentes.py"
      - "tests/unit/test_governanca_tributaria.py"
      - ".github/workflows/validacao-tributaria.yml"
  pull_request:
    paths:
      - "tributacao/**"
      - "validacao/tributacao/**"
      - "tests/fixtures/tributacao/**"
      - "tests/unit/test_tributacao*.py"
      - "tests/unit/test_validadores_tributarios_independentes.py"
      - "tests/unit/test_governanca_tributaria.py"
      - ".github/workflows/validacao-tributaria.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tax-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Compile and lint
        run: |
          python -m compileall -q tributacao validacao tests
          python -m ruff check .

      - name: Run tax tests
        run: |
          python -m pytest -q \
            tests/unit/test_tributacao.py \
            tests/unit/test_tributacao_casos_dourados.py \
            tests/unit/test_validadores_tributarios_independentes.py \
            tests/unit/test_governanca_tributaria.py \
            --tb=short

      - name: Generate independent reports
        run: |
          python -m validacao.tributacao.validar_tudo \
            --saida relatorios_tributarios
          python -m validacao.tributacao.auditar_fontes \
            --saida relatorios_tributarios/auditoria_fontes.json
          python -m validacao.tributacao.reconciliar_documentos \
            modelos/casos_tributarios_reais_anonimizados.json \
            --saida relatorios_tributarios/reconciliacao_exemplo.json

      - name: Upload audit evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: relatorios-validacao-tributaria
          path: relatorios_tributarios/
          if-no-files-found: error
          retention-days: 90
